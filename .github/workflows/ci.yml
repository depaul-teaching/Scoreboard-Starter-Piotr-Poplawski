name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scoreboard-api/requirements*.txt

      - name: Install dependencies
        run: | 
          pip install -r      requirements-dev.txt

      - name: Run tests
        run: | 
          pytest -v